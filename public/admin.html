<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Admin Paneli</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); position: relative; }
        
        .lang-switcher { position: absolute; top: 30px; right: 30px; }
        .lang-switcher button { background: #dfe4ea; border: none; padding: 5px 8px; font-size: 11px; margin-left: 2px; border-radius: 4px; cursor: pointer; font-weight: bold; color: #57606f; }
        .lang-switcher button.active { background: #2c3e50; color: white; }

        h1 { color: #2c3e50; text-align: center; margin-bottom: 25px; font-size: 24px; }
        .card { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 10px; padding: 20px; margin-bottom: 25px; }
        .card-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #34495e; display: flex; align-items: center; gap: 8px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: #495057; }
        input, select, textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ced4da; border-radius: 6px; font-size: 14px; font-family: inherit; }
        textarea { resize: vertical; height: 60px; }
        button.btn-primary { background: #27ae60; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; transition: 0.2s; }
        button.btn-primary:hover { background: #219653; }
        
        /* QR Kod Bloku */
        .qr-card { text-align: center; background: #e8f4fd; border: 1px solid #bde0fe; }
        .qr-card img { width: 180px; height: 180px; margin: 10px 0; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .qr-link { font-size: 13px; color: #2980b9; word-break: break-all; margin-bottom: 10px; display: block; font-weight: 600; }
        .table-input-box { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 10px; }
        .table-input-box input { width: 80px; text-align: center; font-weight: bold; }

        .menu-list { display: grid; gap: 12px; }
        .menu-item-card { display: flex; align-items: center; justify-content: space-between; background: #fff; border: 1px solid #e9ecef; padding: 12px; border-radius: 8px; }
        .menu-item-card img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; margin-right: 15px; }
        .item-info { flex-grow: 1; }
        .item-title { font-weight: bold; font-size: 15px; color: #2c3e50; }
        .item-category { font-size: 12px; background: #e8f4fd; color: #2980b9; padding: 2px 8px; border-radius: 4px; display: inline-block; margin-top: 4px; }
        .item-price { color: #27ae60; font-weight: bold; margin-left: 10px; }
        .item-desc { font-size: 12px; color: #7f8c8d; margin-top: 4px; }
        
        .actions { display: flex; gap: 6px; }
        .btn-sm { padding: 6px 12px; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; }
        .btn-edit { background: #f39c12; } .btn-edit:hover { background: #d68910; }
        .btn-delete { background: #e74c3c; } .btn-delete:hover { background: #c0392b; }
        .status-badge { font-size: 11px; padding: 3px 6px; border-radius: 4px; color: white; font-weight: bold; }
        .in-stock { background: #27ae60; }
        .out-of-stock { background: #95a5a6; }
    </style>
</head>
<body>

<div class="container">
    <div class="lang-switcher">
        <button onclick="changeAdminLang('az')" id="lang-az" class="active">AZ</button>
        <button onclick="changeAdminLang('ru')" id="lang-ru">RU</button>
        <button onclick="changeAdminLang('kk')" id="lang-kk">KZ</button>
        <button onclick="changeAdminLang('en')" id="lang-en">EN</button>
    </div>

    <h1 id="admin-title">Kafe Admin Paneli</h1>

    <!-- 🖨️ STOL ÜÇÜN QR KOD BÖLMƏSİ -->
    <div class="card qr-card">
        <div class="card-title" id="lbl-qr-title" style="justify-content: center;">🖨️ Masalar üçün QR Kod</div>
        <div class="table-input-box">
            <label id="lbl-table-num" style="margin:0;">Masa nömrəsi:</label>
            <input type="number" id="table-number" value="1" min="1" onchange="loadQRCode()">
        </div>
        <a id="qr-menu-link" class="qr-link" href="#" target="_blank">Yüklənir...</a>
        <div>
            <img id="qr-img" src="" alt="QR Menyu">
        </div>
        <p style="font-size: 12px; color: #57606f; margin-top: 5px;" id="lbl-qr-desc">Hər masa üçün nömrəni dəyişib həmin masaya özəl QR kodu çap edə bilərsiniz.</p>
    </div>

    <!-- Yemək Əlavə/Redaktə Kartı -->
    <div class="card">
        <div class="card-title" id="form-heading">🍽️ Yeni Yemək Əlavə Et</div>
        <input type="hidden" id="edit-id" value="">
        
        <div class="grid-2">
            <div class="form-group">
                <label id="lbl-category">Kateqoriya:</label>
                <input type="text" id="category" placeholder="Məsələn: Kebablar, Şorbalar, İçkilər">
            </div>
            <div class="form-group">
                <label id="lbl-image">Şəkil URL-i:</label>
                <input type="text" id="image-url" placeholder="https://example.com/image.jpg">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label id="lbl-name-az">Yeməyin Adı (AZ):</label>
                <input type="text" id="name-az" placeholder="Lülə Kebab">
            </div>
            <div class="form-group">
                <label id="lbl-name-ru">Yeməyin Adı (RU):</label>
                <input type="text" id="name-ru" placeholder="Люля Кебаб">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label id="lbl-name-kk">Yeməyin Adı (KZ):</label>
                <input type="text" id="name-kk" placeholder="Люля Кебаб">
            </div>
            <div class="form-group">
                <label id="lbl-name-en">Yeməyin Adı (EN):</label>
                <input type="text" id="name-en" placeholder="Lula Kebab">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label id="lbl-desc-az">Təsvir / Tərkibi (AZ):</label>
                <textarea id="desc-az" placeholder="Yeməyin tərkibi və ya haqqında məlumat..."></textarea>
            </div>
            <div class="form-group">
                <label id="lbl-desc-ru">Təsvir / Tərkibi (RU):</label>
                <textarea id="desc-ru" placeholder="Описание блюда..."></textarea>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label id="lbl-price">Qiymət (KZT):</label>
                <input type="number" id="price" placeholder="2200">
            </div>
            <div class="form-group">
                <label id="lbl-status">Mövcudluq Statusu:</label>
                <select id="available">
                    <option value="true" id="opt-stock-yes">Mövcuddur (Satışda)</option>
                    <option value="false" id="opt-stock-no">Tükənib (Menyuda görünməsin)</option>
                </select>
            </div>
        </div>

        <button class="btn-primary" id="save-menu-btn" onclick="saveMenuItem()">Yeməyi Yadda Saxla</button>
    </div>

    <h2 id="lbl-menu-title">📋 Mövcud Menyu</h2>
    <div class="menu-list" id="current-menu">Yüklənir...</div>
</div>

<script>
    const pathSegments = window.location.pathname.split('/').filter(Boolean);
    const cafeSlug = pathSegments[pathSegments.length - 1] || 'mangal';
    let menuData = [];
    let currentAdminLang = 'az';

    const adminTexts = {
        az: {
            qrTitle: "🖨️ Masalar üçün QR Kod", qrDesc: "Hər masa üçün nömrəni dəyişib həmin masaya özəl QR kodu çap edə bilərsiniz.", tableLbl: "Masa nömrəsi:",
            category: "Kateqoriya:", image: "Şəkil URL-i:", nameAz: "Yeməyin Adı (AZ):", nameRu: "Yeməyin Adı (RU):",
            nameKk: "Yeməyin Adı (KZ):", nameEn: "Yeməyin Adı (EN):", descAz: "Təsvir / Tərkibi (AZ):", descRu: "Təsvir / Tərkibi (RU):",
            price: "Qiymət (KZT):", status: "Mövcudluq Statusu:", yes: "Mövcuddur (Satışda)", no: "Tükənib (Menyuda görünməsin)",
            saveBtn: "Yeməyi Yadda Saxla", updateBtn: "Yenilə və Yadda Saxla", menuTitle: "📋 Mövcud Menyu",
            newTitle: "🍽️ Yeni Yemək Əlavə Et", editTitle: "✏️ Yeməyi Redaktə Et", success: "Uğurla yadda saxlanıldı!",
            inStock: "Mövcuddur", outStock: "Tükənib", editBtn: "Redaktə", deleteBtn: "Sil", confirmDelete: "Bu yeməyi silmək istədiyinizə əminsinizmi?"
        },
        ru: {
            qrTitle: "🖨️ QR код для столов", qrDesc: "Меняйте номер стола для генерации уникального QR-кода на каждый стол.", tableLbl: "Номер стола:",
            category: "Категория:", image: "URL изображения:", nameAz: "Название блюда (AZ):", nameRu: "Название блюда (RU):",
            nameKk: "Название блюда (KZ):", nameEn: "Название блюда (EN):", descAz: "Описание / Состав (AZ):", descRu: "Описание / Состав (RU):",
            price: "Цена (KZT):", status: "Статус наличия:", yes: "В наличии (В продаже)", no: "Нет в наличии (Скрыть в меню)",
            saveBtn: "Сохранить блюдо", updateBtn: "Обновить и сохранить", menuTitle: "📋 Существующее меню",
            newTitle: "🍽️ Добавить новое блюдо", editTitle: "✏️ Редактировать блюдо", success: "Успешно сохранено!",
            inStock: "В наличии", outStock: "Нет в наличии", editBtn: "Редактировать", deleteBtn: "Удалить", confirmDelete: "Вы уверены, что хотите удалить это блюдо?"
        },
        kk: {
            qrTitle: "🖨️ Столдарға арналған QR код", qrDesc: "Әр стол үшін жеке QR код жасау үшін нөмірді өзгертіңіз.", tableLbl: "Стол нөмірі:",
            category: "Санат:", image: "Сурет URL:", nameAz: "Тағам атауы (AZ):", nameRu: "Тағам атауы (RU):",
            nameKk: "Тағам атауы (KZ):", nameEn: "Тағам атауы (EN):", descAz: "Сипаттамасы (AZ):", descRu: "Сипаттамасы (RU):",
            price: "Бағасы (KZT):", status: "Қолжетімділік күйі:", yes: "Қолжетімді (Сатуда)", no: "Таусылды (Мәзірден жасыру)",
            saveBtn: "Тағамды сақтау", updateBtn: "Жаңарту және сақтау", menuTitle: "📋 Қолданыстағы мәзір",
            newTitle: "🍽️ Жаңа тағам қосу", editTitle: "✏️ Тағамды өзгерту", success: "Сәтті сақталды!",
            inStock: "Бар", outStock: "Таусылды", editBtn: "Өзгерту", deleteBtn: "Жою", confirmDelete: "Бұл тағамды жойғыңыз келетініне сенімдісіз бе?"
        },
        en: {
            qrTitle: "🖨️ QR Code for Tables", qrDesc: "Change the table number to generate a unique QR code for each table.", tableLbl: "Table Number:",
            category: "Category:", image: "Image URL:", nameAz: "Dish Name (AZ):", nameRu: "Dish Name (RU):",
            nameKk: "Dish Name (KZ):", nameEn: "Dish Name (EN):", descAz: "Description (AZ):", descRu: "Description (RU):",
            price: "Price (KZT):", status: "Availability Status:", yes: "In Stock (Available)", no: "Out of Stock (Hidden)",
            saveBtn: "Save Dish", updateBtn: "Update and Save", menuTitle: "📋 Existing Menu",
            newTitle: "🍽️ Add New Dish", editTitle: "✏️ Edit Dish", success: "Successfully saved!",
            inStock: "In Stock", outStock: "Out of Stock", editBtn: "Edit", deleteBtn: "Delete", confirmDelete: "Are you sure you want to delete this dish?"
        }
    };

    function changeAdminLang(lang) {
        currentAdminLang = lang;
        document.querySelectorAll('.lang-switcher button').forEach(b => b.classList.remove('active'));
        document.getElementById(`lang-${lang}`).classList.add('active');

        const t = adminTexts[lang];
        document.getElementById('lbl-qr-title').innerText = t.qrTitle;
        document.getElementById('lbl-qr-desc').innerText = t.qrDesc;
        document.getElementById('lbl-table-num').innerText = t.tableLbl;
        document.getElementById('lbl-category').innerText = t.category;
        document.getElementById('lbl-image').innerText = t.image;
        document.getElementById('lbl-name-az').innerText = t.nameAz;
        document.getElementById('lbl-name-ru').innerText = t.nameRu;
        document.getElementById('lbl-name-kk').innerText = t.nameKk;
        document.getElementById('lbl-name-en').innerText = t.nameEn;
        document.getElementById('lbl-desc-az').innerText = t.descAz;
        document.getElementById('lbl-desc-ru').innerText = t.descRu;
        document.getElementById('lbl-price').innerText = t.price;
        document.getElementById('lbl-status').innerText = t.status;
        document.getElementById('opt-stock-yes').innerText = t.yes;
        document.getElementById('opt-stock-no').innerText = t.no;
        document.getElementById('lbl-menu-title').innerText = t.menuTitle;

        const editId = document.getElementById('edit-id').value;
        if (editId) {
            document.getElementById('save-menu-btn').innerText = t.updateBtn;
            document.getElementById('form-heading').innerText = t.editTitle;
        } else {
            document.getElementById('save-menu-btn').innerText = t.saveBtn;
            document.getElementById('form-heading').innerText = t.newTitle;
        }

        if (menuData.length > 0) {
            renderMenu(menuData);
        }
    }

    async function loadQRCode() {
        const tableNum = document.getElementById('table-number').value || 1;
        try {
            const qrRes = await fetch(`/api/admin/qrcode/${cafeSlug}?table=${tableNum}`);
            const qrData = await qrRes.json();
            if (qrData.success) {
                document.getElementById('qr-img').src = qrData.qrImage;
                const linkEl = document.getElementById('qr-menu-link');
                linkEl.href = qrData.menuUrl;
                linkEl.innerText = qrData.menuUrl;
            }
        } catch (e) {
            console.error("QR xətası:", e);
        }
    }

    async function loadData() {
        try {
            const res = await fetch(`/api/menu/${cafeSlug}`);
            if (!res.ok) throw new Error();
            const data = await res.json();
            const titleEl = document.getElementById('admin-title');
            if (titleEl) titleEl.innerText = `${data.name} - İdarəetmə Paneli`;
            menuData = data.menu;
            renderMenu(data.menu);
            await loadQRCode();
        } catch (e) {
            const titleEl = document.getElementById('admin-title');
            if (titleEl) titleEl.innerText = 'Xəta: Kafe tapılmadı';
        }
    }

    function renderMenu(menu) {
        const container = document.getElementById('current-menu');
        container.innerHTML = menu.length === 0 ? 'Menyu boşdur.' : '';
        const t = adminTexts[currentAdminLang];

        menu.forEach(item => {
            const name = typeof item.name === 'object' ? (item.name[currentAdminLang] || item.name.az || item.name.ru) : item.name;
            const desc = typeof item.description === 'object' ? (item.description[currentAdminLang] || item.description.az || item.description.ru || '') : (item.description || '');
            const img = item.image || 'https://via.placeholder.com/60?text=Yemək';
            const statusText = item.available ? t.inStock : t.outStock;
            const statusClass = item.available ? 'in-stock' : 'out-of-stock';
            const statusBadge = `<span class="status-badge ${statusClass}">${statusText}</span>`;

            container.innerHTML += `
                <div class="menu-item-card">
                    <img src="${img}" alt="${name}" onerror="this.src='https://via.placeholder.com/60?text=Yemək'">
                    <div class="item-info">
                        <div>
                            <span class="item-title">${name}</span>
                            <span class="item-price">${item.price} KZT</span>
                            ${statusBadge}
                        </div>
                        <span class="item-category">${item.category || 'Ümumi'}</span>
                        ${desc ? `<div class="item-desc">${desc}</div>` : ''}
                    </div>
                    <div class="actions">
                        <button class="btn-sm btn-edit" onclick="editItem(${item.id})">${t.editBtn}</button>
                        <button class="btn-sm btn-delete" onclick="deleteItem(${item.id})">${t.deleteBtn}</button>
                    </div>
                </div>
            `;
        });
    }

    async function saveMenuItem() {
        const id = document.getElementById('edit-id').value;
        const category = document.getElementById('category').value;
        const image = document.getElementById('image-url').value;
        const price = document.getElementById('price').value;
        const available = document.getElementById('available').value === 'true';

        const nameAz = document.getElementById('name-az').value;
        const nameRu = document.getElementById('name-ru').value || nameAz;
        const nameKk = document.getElementById('name-kk').value || nameAz;
        const nameEn = document.getElementById('name-en').value || nameAz;

        const descAz = document.getElementById('desc-az').value;
        const descRu = document.getElementById('desc-ru').value || descAz;

        if (!nameAz || !price) { alert('Zəhmət olmasa adı (AZ) və qiyməti daxil edin!'); return; }

        const nameObj = { az: nameAz, ru: nameRu, kk: nameKk, en: nameEn };
        const descObj = { az: descAz, ru: descRu, kk: descAz, en: descAz };

        const url = id ? `/api/admin/menu/${cafeSlug}/${id}` : `/api/admin/menu/${cafeSlug}`;
        const method = id ? 'PUT' : 'POST';

        const res = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ category, image, name: nameObj, description: descObj, price, available })
        });

        const result = await res.json();
        if (result.success) {
            alert(adminTexts[currentAdminLang].success);
            resetForm();
            loadData();
        } else {
            alert('Xəta: ' + result.error);
        }
    }

    function editItem(id) {
        const item = menuData.find(i => i.id === id);
        if (!item) return;

        document.getElementById('edit-id').value = item.id;
        document.getElementById('category').value = item.category || '';
        document.getElementById('image-url').value = item.image || '';
        document.getElementById('price').value = item.price;
        document.getElementById('available').value = item.available !== undefined ? item.available : true;

        document.getElementById('name-az').value = item.name?.az || item.name || '';
        document.getElementById('name-ru').value = item.name?.ru || '';
        document.getElementById('name-kk').value = item.name?.kk || '';
        document.getElementById('name-en').value = item.name?.en || '';

        document.getElementById('desc-az').value = item.description?.az || item.description || '';
        document.getElementById('desc-ru').value = item.description?.ru || '';

        const t = adminTexts[currentAdminLang];
        document.getElementById('save-menu-btn').innerText = t.updateBtn;
        document.getElementById('form-heading').innerText = t.editTitle;
    }

    async function deleteItem(id) {
        const t = adminTexts[currentAdminLang];
        if (!confirm(t.confirmDelete)) return;
        const res = await fetch(`/api/admin/menu/${cafeSlug}/${id}`, { method: 'DELETE' });
        const result = await res.json();
        if (result.success) loadData();
    }

    function resetForm() {
        document.getElementById('edit-id').value = '';
        document.getElementById('category').value = '';
        document.getElementById('image-url').value = '';
        document.getElementById('price').value = '';
        document.getElementById('name-az').value = '';
        document.getElementById('name-ru').value = '';
        document.getElementById('name-kk').value = '';
        document.getElementById('name-en').value = '';
        document.getElementById('desc-az').value = '';
        document.getElementById('desc-ru').value = '';
        
        const t = adminTexts[currentAdminLang];
        document.getElementById('save-menu-btn').innerText = t.saveBtn;
        document.getElementById('form-heading').innerText = t.newTitle;
    }

    loadData();
</script>

</body>
</html>
