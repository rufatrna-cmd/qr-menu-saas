<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Menyu</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8f9fa; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        
        /* 🔥 PEŞƏKAR VƏ TƏMİZ DİZAYNLI REKLAM KARTI */
        .ad-banner-card {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 22px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.25);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: row;
        }
        .ad-banner-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(15, 23, 42, 0.35);
        }
        .ad-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #ef4444;
            color: #fff;
            font-size: 9px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            z-index: 3;
        }
        /* Sol tərəf: Şəkil */
        .ad-image-side {
            width: 42%;
            position: relative;
            background: #334155;
            min-height: 140px;
        }
        .ad-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        /* Sağ tərəf: Mətn və nömrə */
        .ad-content-side {
            width: 58%;
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
        }
        .ad-title-text {
            font-size: 13px;
            font-weight: 500;
            line-height: 1.4;
            color: #cbd5e1;
            padding-right: 40px; /* Badge üçün boşluq */
        }
        .ad-phone-box {
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            color: #38bdf8;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            width: fit-content;
        }
        .ad-action-btn {
            align-self: flex-start;
            background: #22c55e;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #f1f2f6; padding-bottom: 10px; }
        .lang-switcher button { background: #dfe4ea; border: none; padding: 6px 10px; font-size: 11px; margin-left: 3px; border-radius: 6px; cursor: pointer; font-weight: bold; color: #57606f; }
        .lang-switcher button.active { background: #2f3542; color: white; }
        
        h1 { margin: 0; color: #2f3542; font-size: 22px; }
        
        .menu-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #f1f2f6; align-items: center; }
        .menu-item img { width: 75px; height: 75px; object-fit: cover; border-radius: 8px; }
        .item-details { flex-grow: 1; }
        .item-name { font-size: 15px; font-weight: 600; color: #2f3542; }
        .item-desc { font-size: 12px; color: #747d8c; margin-top: 2px; line-height: 1.3; }
        .item-price { color: #2ed573; font-weight: bold; margin-top: 4px; display: block; font-size: 14px; }
        
        button.add-btn { background: #2ed573; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
        button.add-btn:hover { background: #26af5f; }

        .cart { margin-top: 25px; padding-top: 15px; border-top: 2px solid #f1f2f6; }
        .cart h3 { margin-bottom: 10px; color: #2f3542; }
        .cart-item { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; color: #57606f; }
        
        .order-btn { width: 100%; background: #1e90ff; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <!-- REKLAM BANNERİ -->
    <div id="ad-banner" class="ad-banner-card" style="display: none;" onclick="openAd()">
        <span class="ad-badge">REKLAM</span>
        <div class="ad-image-side">
            <img id="ad-img" class="ad-image" src="" alt="Reklam">
        </div>
        <div class="ad-content-side">
            <div>
                <div id="ad-text" class="ad-title-text"></div>
                <div style="margin-top: 8px;">
                    <div class="ad-phone-box">📞 +7 771 158 46 45</div>
                </div>
            </div>
            <div class="ad-action-btn" id="ad-btn-text">Əlaqə Saxla ➔</div>
        </div>
    </div>

    <div class="header">
        <h1 id="cafe-title">Menyu yüklənir...</h1>
        <div class="lang-switcher">
            <button onclick="changeLang('az')" id="btn-az">AZ</button>
            <button onclick="changeLang('ru')" id="btn-ru">RU</button>
            <button onclick="changeLang('kk')" id="btn-kk">KZ</button>
            <button onclick="changeLang('en')" id="btn-en">EN</button>
        </div>
    </div>

    <div id="menu-list"></div>

    <div class="cart">
        <h3 id="cart-title">Səbət</h3>
        <div id="cart-items">Səbət boşdur</div>
        <p style="font-size: 16px; margin-top: 10px;"><strong><span id="total-text">Cəmi</span>: <span id="total-price">0</span> KZT</strong></p>
        <button class="order-btn" id="order-btn-text" onclick="sendOrder()">Sifarişi Mətbəxə Göndər</button>
    </div>
</div>

<script>
    const translations = {
        az: { cartTitle: "Səbət", emptyCart: "Səbət boşdur", total: "Cəmi", orderBtn: "Sifarişi Mətbəxə Göndər", addBtn: "Əlavə et", successOrder: "Sifariş uğurla göndərildi!", emptyAlert: "Səbətiniz boşdur!", errorServer: "Xəta baş verdi!", notFound: "Kafe tapılmadı!", adBtn: "Əlaqə Saxla ➔" },
        ru: { cartTitle: "Корзина", emptyCart: "Корзина пуста", total: "Итого", orderBtn: "Отправить заказ на кухню", addBtn: "Добавить", successOrder: "Заказ успешно отправлен!", emptyAlert: "Корзина пуста!", errorServer: "Ошибка соединения!", notFound: "Кафе не найдено!", adBtn: "Связаться ➔" },
        kk: { cartTitle: "Себет", emptyCart: "Себет бос", total: "Барлығы", orderBtn: "Тапсырысты асүйге жіберу", addBtn: "Қосу", successOrder: "Тапсырыс жіберілді!", emptyAlert: "Себет бос!", errorServer: "Қате орын алды!", notFound: "Кафе табылмады!", adBtn: "Байланысу ➔" },
        en: { cartTitle: "Cart", emptyCart: "Cart is empty", total: "Total", orderBtn: "Send Order to Kitchen", addBtn: "Add", successOrder: "Order sent successfully!", emptyAlert: "Cart is empty!", errorServer: "Server error!", notFound: "Cafe not found!", adBtn: "Contact Us ➔" }
    };

    let currentLang = 'ru';
    let cafeData = null;
    let cart = {};
    let adLink = '#';

    function changeLang(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-switcher button').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${lang}`).classList.add('active');
        updateUITexts();
        if (cafeData) { renderMenu(); updateCartUI(); renderBanner(); }
    }

    function updateUITexts() {
        const t = translations[currentLang];
        document.getElementById('cart-title').innerText = t.cartTitle;
        document.getElementById('total-text').innerText = t.total;
        document.getElementById('order-btn-text').innerText = t.orderBtn;
        document.getElementById('ad-btn-text').innerText = t.adBtn;
        if (cafeData) document.getElementById('cafe-title').innerText = cafeData.name;
    }

    const pathSegments = window.location.pathname.split('/').filter(Boolean);
    const cafeSlug = pathSegments[0] || 'mangal';

    async function loadMenu() {
        try {
            const res = await fetch(`/api/menu/${cafeSlug}`);
            if (!res.ok) throw new Error();
            cafeData = await res.json();
            changeLang(currentLang);
        } catch (e) {
            document.getElementById('cafe-title').innerText = translations[currentLang].notFound;
        }
    }

    function renderBanner() {
        const bannerEl = document.getElementById('ad-banner');
        const bannerImg = document.getElementById('ad-img');
        const bannerText = document.getElementById('ad-text');

        if (cafeData && cafeData.adBanner && cafeData.adBanner.active) {
            const text = cafeData.adBanner.text[currentLang] || cafeData.adBanner.text['ru'] || cafeData.adBanner.text['az'] || 'Burada sizin reklamınız ola bilər!';
            bannerText.innerText = text;

            if (cafeData.adBanner.image) {
                bannerImg.src = cafeData.adBanner.image;
            } else {
                bannerImg.src = 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=600';
            }

            bannerEl.style.display = 'flex';
            adLink = cafeData.adBanner.link || 'https://wa.me/77711584645';
        } else {
            bannerEl.style.display = 'none';
        }
    }

    function openAd() {
        if (adLink && adLink !== '#') window.open(adLink, '_blank');
    }

    function getLocalizedText(field) {
        if (!field) return '';
        if (typeof field === 'string') return field;
        return field[currentLang] || field['ru'] || field['az'] || Object.values(field)[0] || '';
    }

    function renderMenu() {
        const container = document.getElementById('menu-list');
        container.innerHTML = '';
        const t = translations[currentLang];

        cafeData.menu.forEach(item => {
            if (item.available === false) return;

            const name = getLocalizedText(item.name);
            const desc = getLocalizedText(item.description);
            const img = item.image || 'https://via.placeholder.com/75?text=Yemək';

            container.innerHTML += `
                <div class="menu-item">
                    <img src="${img}" alt="${name}" onerror="this.src='https://via.placeholder.com/75?text=Yemək'">
                    <div class="item-details">
                        <span class="item-name">${name}</span>
                        ${desc ? `<div class="item-desc">${desc}</div>` : ''}
                        <span class="item-price">${item.price} KZT</span>
                    </div>
                    <button class="add-btn" onclick="addToCart(${item.id})">${t.addBtn}</button>
                </div>
            `;
        });
    }

    function addToCart(id) {
        const item = cafeData.menu.find(i => i.id === id);
        if (!item) return;
        if (!cart[id]) cart[id] = { ...item, count: 0 };
        cart[id].count++;
        updateCartUI();
    }

    function updateCartUI() {
        const container = document.getElementById('cart-items');
        const totalEl = document.getElementById('total-price');
        const t = translations[currentLang];
        container.innerHTML = '';
        let total = 0;
        const items = Object.values(cart);

        if (items.length === 0) {
            container.innerHTML = t.emptyCart;
            totalEl.innerText = 0;
            return;
        }

        items.forEach(item => {
            total += item.price * item.count;
            const name = getLocalizedText(item.name);
            container.innerHTML += `<div class="cart-item"><span>${name} x ${item.count}</span> <strong>${item.price * item.count} KZT</strong></div>`;
        });
        totalEl.innerText = total;
    }

    async function sendOrder() {
        const items = Object.values(cart);
        const t = translations[currentLang];
        if (items.length === 0) { alert(t.emptyAlert); return; }

        const formattedItems = items.map(i => ({ ...i, name: getLocalizedText(i.name) }));
        const totalPrice = items.reduce((sum, i) => sum + (i.price * i.count), 0);

        try {
            const res = await fetch(`/api/order/${cafeSlug}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tableNumber: 1, items: formattedItems, totalPrice })
            });
            const result = await res.json();
            if (result.success) {
                alert(t.successOrder);
                cart = {};
                updateCartUI();
            } else { alert('Xəta: ' + result.error); }
        } catch (e) { alert(t.errorServer); }
    }

    loadMenu();
</script>

</body>
</html>
